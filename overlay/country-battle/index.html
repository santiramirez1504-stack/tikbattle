<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Batalla de Países</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Escenario del tamaño de la pantalla vertical de TikTok (9:16). Fondo transparente: se ve la cámara -->
  <main class="stage" id="stage">
    <!-- Confeti de la pantalla final (se dibuja con JavaScript) -->
    <canvas class="confetti" id="confetti"></canvas>

    <!-- Arriba en el centro: tiempo, estado (o la última actividad) y regalos que suman -->
    <header class="top" id="top">
      <div class="timer" id="timer">
        <span class="timer-icon">⏱</span>
        <span class="timer-value" id="time">--:--</span>
      </div>
      <div class="status-wrap">
        <p class="status" id="status">Conectando...</p>
        <!-- Actividad: "juan se unió a Cuba", "maria +50 a Cuba"... (se muestra encima del estado) -->
        <ul class="feed" id="feed"></ul>
      </div>
      <div class="gift-strip" id="gift-strip" hidden></div>
    </header>

    <!-- Banderas a los lados: las crea game.js (mitad de los países a cada lado) -->
    <ol class="side side-left" id="side-left"></ol>
    <ol class="side side-right" id="side-right"></ol>

    <!-- "¡X toma el liderato!" -->
    <div class="leader-banner" id="leader-banner" hidden></div>

    <!-- Alerta cuando llega un regalo -->
    <section class="gift-alert" id="gift-alert" hidden>
      <img class="gift-alert-image" id="gift-alert-image" alt="" referrerpolicy="no-referrer">
      <div class="gift-alert-text">
        <strong id="gift-alert-user"></strong>
        <span id="gift-alert-gift"></span>
        <span class="gift-alert-points" id="gift-alert-points"></span>
      </div>
    </section>

    <!-- Cuenta atrás grande de los últimos 10 segundos -->
    <div class="countdown" id="countdown" hidden></div>

    <!-- Pantalla final: podio con los 3 primeros países -->
    <section class="result hidden" id="result">
      <p class="result-title" id="result-title"></p>
      <ol class="podium" id="podium"></ol>
    </section>
  </main>

  <!-- El servidor de Socket.IO sirve automáticamente su librería de cliente en esta ruta -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
